[project]
name = "running-analytics"
version = "0.1.0"
description = "Running & training analytics on intervals.icu data (anfra app + Streamlit app)"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "duckdb>=1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts", "streamlit_app"]
addopts = "-q --cov=scripts --cov=streamlit_app --cov-report=term-missing:skip-covered --cov-fail-under=70"
filterwarnings = [
    # Streamlit's bare-mode import warnings are noise in tests
    "ignore:No runtime found",
    "ignore:missing ScriptRunContext",
]
markers = [
    "unit: fast pure-function tests (no DB, no network)",
    "integration: tests against a fixture DuckDB built from committed data/raw CSVs",
    "anfra: tests that shell out to the anfra CLI (validate / query)",
    "charts: ECharts SSR harness — renders every app chart headlessly (needs node)",
]

[tool.coverage.run]
omit = [
    "scripts/__pycache__/*",
    # Reference build pending model reconciliation (docs/cycling-model-delta.md):
    # the skill-built Streamlit cycling app runs against the v2 model extension,
    # which is deliberately not merged — its suites are skipped in
    # tests/integration/conftest.py, so these files cannot be covered yet.
    "streamlit_app/cycling_app.py",
    "streamlit_app/cycling_queries.py",
    "streamlit_app/cycling_queries_aql.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "^if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["streamlit.*", "plotly.*", "duckdb.*"]
ignore_missing_imports = true
